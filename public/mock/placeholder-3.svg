  <line x1="470" y1="180" x2="530" y2="180" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
  <line x1="340" y1="240" x2="330" y2="200" stroke="#0f172a" stroke-width="12" stroke-linecap="round"/>
  <line x1="300" y1="200" x2="350" y2="200" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  <text x="400" y="520" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#334155" text-anchor="middle">Hero Sprint 26T MTB (Side)</text>
