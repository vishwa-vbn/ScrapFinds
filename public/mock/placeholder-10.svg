<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#f8fafc"/>
  <!-- Commuter cycle with rear carrier -->
  <circle cx="230" cy="360" r="90" fill="none" stroke="#475569" stroke-width="12"/>
  <circle cx="570" cy="360" r="90" fill="none" stroke="#475569" stroke-width="12"/>
  <polyline points="230,360 380,360 480,250 330,250 230,360" fill="none" stroke="#0284c7" stroke-width="10"/>
  <line x1="380" y1="360" x2="330" y2="250" stroke="#0284c7" stroke-width="10"/>
  <line x1="480" y1="250" x2="570" y2="360" stroke="#0284c7" stroke-width="10"/>
  <!-- Rear carrier -->
  <rect x="180" y="240" width="120" height="15" rx="3" fill="#1e293b"/>
  <line x1="200" y1="255" x2="230" y2="360" stroke="#1e293b" stroke-width="6"/>
  <line x1="280" y1="255" x2="230" y2="360" stroke="#1e293b" stroke-width="6"/>
  <text x="400" y="520" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#334155" text-anchor="middle">Hercules Adult Commuter Cycle</text>
</svg>
