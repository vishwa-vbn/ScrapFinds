  <circle cx="240" cy="360" r="100" fill="none" stroke="#334155" stroke-width="14"/>
  <circle cx="560" cy="360" r="100" fill="none" stroke="#334155" stroke-width="14"/>
  <circle cx="240" cy="360" r="16" fill="#64748b"/>
  <circle cx="560" cy="360" r="16" fill="#64748b"/>
